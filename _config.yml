title: "AI Research Daily"
description: "Daily arXiv paper summaries and Chinese podcasts — AI Agents, Auto Scientific Research, and AI for Science"
url: "https://solitary2005.github.io"
baseurl: "/research_pipeline"

markdown: kramdown

collections:
  papers:
    output: true
    permalink: /papers/:name/
  podcasts:
    output: true
    permalink: /podcasts/:name/

defaults:
  - scope:
      path: ""
      type: "papers"
    values:
      layout: "paper"
  - scope:
      path: ""
      type: "podcasts"
    values:
      layout: "podcast"
